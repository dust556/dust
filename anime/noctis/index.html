<title>NOCTIS Teaser</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b0e; --panel:#141419; --line:#272630; --text:#e9e7ee; --mute:#8f8c9b;
  --ren:#39d5ff; --yuki:#ff2d4b; --kai:#9b6bff; --shion:#58ff9a; --orphe:#e6b650; --none:#8f8c9b;
  --serif:"Cinzel","Trajan Pro","Times New Roman",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:14px;line-height:1.7}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:22px 56px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.6vw,36px);letter-spacing:.42em;line-height:1.1}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--mute)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.title span{font-family:var(--serif);font-weight:400;font-size:clamp(34px,8.2vw,96px);letter-spacing:.5em;margin-right:-.5em;color:#ecebf2}
.replay{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);font:700 14px var(--body);color:#0b0b0e;background:#ecebf2;border:0;border-radius:2px;padding:9px 22px;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar button{font:700 13px var(--body);color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 14px;cursor:pointer;min-width:44px}
.bar button:hover{border-color:#4a4858}
.bar button[aria-pressed="true"]{border-color:var(--text)}
button:focus-visible,#scrub:focus-visible{outline:2px solid var(--ren);outline-offset:2px}
#scrub{flex:1 1 220px;min-width:0;accent-color:#d9d7e2}
.tc{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.tc b{color:var(--text);font-weight:600}
.now{font-size:13px;color:var(--mute);white-space:nowrap}
.now b{color:var(--text);font-family:var(--mono);font-weight:600;margin-right:6px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.25em;color:var(--mute);margin:8px 0 0}
.cuts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.cuts button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--none));border-radius:3px;color:var(--text);padding:6px 10px;cursor:pointer;font:400 13px/1.45 var(--body)}
.cuts button .no{display:block;font-family:var(--mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.cuts button.on{background:#1f1f27;border-color:var(--c,var(--none))}
.note{max-width:70ch;color:#bdbac8;font-size:13px;margin:0}
</style>

<div class="wrap">
  <header>
    <h1>NOCTIS</h1>
    <span class="kicker">TEASER PV · 15 SEC · REAL-TIME 3DCG</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>
    <div class="title" id="title"><span>NOCTIS</span></div>
    <button class="replay" id="replay" hidden>もう一度見る</button>
  </div>

  <div class="bar">
    <button id="play" aria-label="一時停止">❚❚</button>
    <button id="restart">最初から</button>
    <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="再生位置">
    <span class="tc" id="tc"><b>0+00</b> / 15+00</span>
    <button id="snd" aria-pressed="false">サウンド オフ</button>
    <span class="now" id="now"></span>
  </div>

  <p class="lbl">カット表　秒+コマ（24コマ/秒）</p>
  <ol class="cuts" id="cuts"></ol>
  <p class="note">映像内には文字を入れず、最後のタイトルカードだけに「NOCTIS」を出しています。キャラクターの配色と能力はキャラクターラインナップに合わせました（レン＝青い黒環、ユキ＝赤いワイヤー、カイ＝紫の重力、シオン＝緑の音波、オルフェ＝黒い影と金）。</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
const DUR = 15;
const TAU = Math.PI * 2, PI = Math.PI;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C3 = (r, g, b) => new THREE.Color().setRGB(r, g, b);

// ---------- renderer & passes ----------
const stage = document.getElementById('stage'), glc = document.getElementById('gl'), fxc = document.getElementById('fx'), ctx = fxc.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(PR);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.02, 1200);
camera.layers.enable(1);
const mirrorCam = new THREE.PerspectiveCamera(); mirrorCam.layers.set(0);
const HF = { type: THREE.HalfFloatType };
const rtScene = new THREE.WebGLRenderTarget(1, 1, Object.assign({ samples: 4 }, HF));
const rtRef = new THREE.WebGLRenderTarget(1, 1, HF);
const rtA = new THREE.WebGLRenderTarget(1, 1, HF), rtB = new THREE.WebGLRenderTarget(1, 1, HF);
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quad.frustumCulled = false; quadScene.add(quad);
const VS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
const pm = (u, fs) => new THREE.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false });
const brightMat = pm({ t: { value: null } }, 'uniform sampler2D t;varying vec2 vUv;void main(){vec3 c=texture2D(t,vUv).rgb;float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(.72,1.35,l),1.);}');
const blurMat = pm({ t: { value: null }, dir: { value: new THREE.Vector2() } }, 'uniform sampler2D t;uniform vec2 dir;varying vec2 vUv;void main(){vec3 c=texture2D(t,vUv).rgb*.227;c+=(texture2D(t,vUv+dir*1.385).rgb+texture2D(t,vUv-dir*1.385).rgb)*.316;c+=(texture2D(t,vUv+dir*3.231).rgb+texture2D(t,vUv-dir*3.231).rgb)*.07;gl_FragColor=vec4(c,1.);}');
const compMat = pm({
  tS: { value: rtScene.texture }, tB: { value: rtA.texture }, uBloom: { value: 1 }, uFlash: { value: 0 }, uFlashC: { value: V(1, 1, 1) }, uFade: { value: 0 }, uAb: { value: .002 }, uT: { value: 0 },
  uLens: { value: new THREE.Vector2(.5, .5) }, uLensS: { value: 0 }, uAsp: { value: 16 / 9 }, uTint: { value: V(1, 1, 1) }
}, `uniform sampler2D tS,tB;uniform float uBloom,uFlash,uFade,uAb,uT,uLensS,uAsp;uniform vec2 uLens;uniform vec3 uFlashC,uTint;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec2 uv=vUv;vec2 d=uv-uLens;d.x*=uAsp;float r=length(d);
 vec2 n=d/max(r,1e-4);n.x/=uAsp;uv-=n*uLensS*r*exp(-r*r*14.);uv+=n*uLensS*.04*sin(r*60.-uT*20.)*exp(-r*r*10.);

 c+=texture2D(tB,uv).rgb*uBloom;c*=uTint;c=c/(1.+c*.22)*1.18;

// ---------- shared materials & textures ----------
const gradTex = (() => { const d = new Uint8Array([55, 55, 55, 255, 135, 135, 135, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (c, o = {}) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: gradTex }, o));
const basic = (c, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color: c, fog: false }, o));
const addB = (c, o = {}) => basic(c, Object.assign({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }, o));
const OUT = new THREE.ShaderMaterial({ uniforms: { th: { value: .011 } }, vertexShader: 'uniform float th;void main(){vec3 p=position+normal*th;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}', fragmentShader: 'void main(){gl_FragColor=vec4(.012,.01,.02,1.);}', side: THREE.BackSide });
function canvasTex(size, draw) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); return new THREE.CanvasTexture(c); }

const discTex = canvasTex(128, (g, s) => { g.fillStyle = '#fff'; g.beginPath(); g.arc(s / 2, s / 2, s * .46, 0, TAU); g.fill(); });
const haloTex = canvasTex(256, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, s * .2, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(255,255,255,0)'); r.addColorStop(.3, 'rgba(255,255,255,.95)'); r.addColorStop(.36, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); });

  return canvasTex(128, (g) => {
    g.save(); g.beginPath(); g.moveTo(14, 60); g.quadraticCurveTo(60, 14, 116, 40); g.lineTo(112, 92); g.quadraticCurveTo(64, 118, 20, 96); g.closePath();
    g.fillStyle = '#f4f1f6'; g.fill(); g.clip();
    const ir = g.createLinearGradient(0, 22, 0, 112); ir.addColorStop(0, '#0b0a10'); ir.addColorStop(.45, col); ir.addColorStop(1, '#ffffff');
    g.fillStyle = ir; g.beginPath(); g.ellipse(66, 70, 30, 42, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(8,6,14,.9)'; g.beginPath(); g.ellipse(66, 70, 12, 19, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(10,8,16,.8)'; g.lineWidth = 3; g.beginPath(); g.ellipse(66, 70, 30, 42, 0, 0, TAU); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(52, 52, 9, 0, TAU); g.fill(); g.beginPath(); g.arc(80, 90, 4, 0, TAU); g.fill();
    g.restore();
    g.strokeStyle = '#0c0a12'; g.lineCap = 'round'; g.lineWidth = 11; g.beginPath(); g.moveTo(12, 62); g.quadraticCurveTo(60, 12, 118, 38); g.stroke();
    g.lineWidth = 6; g.beginPath(); g.moveTo(112, 38); g.lineTo(124, 52); g.stroke();
    g.lineWidth = 3; g.beginPath(); g.moveTo(26, 98); g.quadraticCurveTo(66, 116, 108, 94); g.stroke();
  });
}

// ---------- character rig ----------
const cap = (r, l) => new THREE.CapsuleGeometry(r, l, 4, 12);
const J = (p, pos) => { const g = new THREE.Group(); g.position.set(...pos); p.add(g); return g; };
function part(parent, geo, mat, pos, rot, scl, outline = true) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos); if (rot) m.rotation.set(...rot); if (scl) m.scale.set(...scl);
  parent.add(m); if (outline) m.add(new THREE.Mesh(geo, OUT)); return m;
}
const _up = V(0, 1, 0);
function clump(parent, mat, pos, dir, len, rad) {
  const geo = new THREE.ConeGeometry(rad, len, 7); geo.translate(0, len / 2, 0);
  const m = part(parent, geo, mat, pos); m.quaternion.setFromUnitVectors(_up, V(...dir).normalize()); return m;
}
function stick(parent, mat, a, b, r, outline = false) {
  const A = V(...a), B = V(...b), L = A.distanceTo(B);
  const m = part(parent, new THREE.CylinderGeometry(r, r, L, 6), mat, null, null, null, outline);
  m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(_up, B.clone().sub(A).normalize()); return m;
}
function coatSkirt(parent, outer, inner, rt, rb, h, y, open = 1.0) {
  const g = new THREE.Group(); g.position.y = y; parent.add(g);
  const geo = new THREE.CylinderGeometry(rt, rb, h, 20, 1, true, open / 2, TAU - open); geo.translate(0, -h / 2, 0);
  const o = new THREE.Mesh(geo, outer); g.add(o);
  const ig = new THREE.CylinderGeometry(rt * .97, rb * .97, h * .99, 20, 1, true, open / 2, TAU - open); ig.translate(0, -h / 2, 0);
  g.add(new THREE.Mesh(ig, inner));
  const og = new THREE.CylinderGeometry(rt + .012, rb + .014, h + .01, 20, 1, true, open / 2, TAU - open); og.translate(0, -h / 2, 0);
  const ol = new THREE.Mesh(og, new THREE.MeshBasicMaterial({ color: 0x030205, side: THREE.BackSide })); g.add(ol);
  return g;
}
const JN = ['torso', 'head', 'lSh', 'lEl', 'rSh', 'rEl', 'lHip', 'lKn', 'rHip', 'rKn'];
function buildBody(o) {
  const M = o.M, root = new THREE.Group(), j = { skirts: [], eyes: [] };
  j.hips = J(root, [0, 1, 0]);
  part(j.hips, cap(o.hipR, .08), M.bottom, [0, 0, 0], [0, 0, PI / 2]);
  j.torso = J(j.hips, [0, .05, 0]);
  part(j.torso, cap(o.chestR, .2), M.top, [0, .23, 0], null, [1, 1, .85]);
  part(j.torso, cap(.042, .06), M.skin, [0, .5, 0]);
  j.head = J(j.torso, [0, .55, 0]);
  part(j.head, new THREE.SphereGeometry(.113, 24, 18), M.skin, [0, .115, 0], null, [.96, 1.08, 1]);
  part(j.head, new THREE.SphereGeometry(.078, 16, 12), M.skin, [0, .055, .025], null, [1, 1, 1], false);
  if (o.eyes) {
    o.eyes.forEach((tex, k) => {
      const s = k === 0 ? 1 : -1;
      const e = new THREE.Mesh(new THREE.PlaneGeometry(.05, .05), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: .35 }));
      e.position.set(s * .041, .1, .106); e.rotation.y = s * .33; e.scale.x = s; j.head.add(e); j.eyes.push(e);
    });
    for (const s of [1, -1]) { const b = part(j.head, new THREE.BoxGeometry(.04, .007, .006), M.hair, [s * .044, .142, .104], [0, s * .3, -s * .12], null, false); }
    part(j.head, new THREE.BoxGeometry(.02, .004, .004), new THREE.MeshBasicMaterial({ color: 0x7a3a44 }), [0, .038, .1], null, null, false);
  }

    const s = k === 'l' ? 1 : -1;
    const sh = j[k + 'Sh'] = J(j.torso, [s * o.shX, .42, 0]);
    part(sh, new THREE.SphereGeometry(o.armR * 1.35, 12, 10), M.upper, [0, 0, 0]);
    part(sh, cap(o.armR, .2), M.upper, [0, -.14, 0]);
    const el = j[k + 'El'] = J(sh, [0, -.28, 0]);
    part(el, cap(o.foreR, .19), M.fore, [0, -.13, 0]);
    part(el, new THREE.SphereGeometry(.036, 10, 8), M.hand, [0, -.29, 0], null, [1, 1.2, .8]);
    const hp = j[k + 'Hip'] = J(j.hips, [s * .088, -.03, 0]);
    part(hp, cap(o.legR, .34), M.thigh, [0, -.23, 0]);
    const kn = j[k + 'Kn'] = J(hp, [0, -.47, 0]);
    part(kn, cap(o.legR * .82, .34), M.shin, [0, -.23, 0]);
    part(kn, new THREE.BoxGeometry(.095, .075, .24), M.shoe, [0, -.47, .045]);
    part(kn, new THREE.BoxGeometry(.1, .025, .25), M.sole, [0, -.505, .045], null, null, false);

}
function show(f, x, y, z, rotY, pose, t, wind = 1) {

  f.j.skirts.forEach((s, k) => { s.rotation.x = (.05 + .07 * wind) + Math.sin(t * 5 + k * 1.3) * .045 * wind; s.rotation.z = Math.sin(t * 3.7 + k) * .03 * wind; });

}
const Z3 = [0, 0, 0];

// ----- the five -----
const SKIN = 0xe6cbbd;
function buildRen() {
  const M = { skin: toon(SKIN), hair: toon(0x121218), top: toon(0x121217), bottom: toon(0x111115), upper: toon(0x17171d), fore: toon(0x17171d), hand: toon(SKIN), thigh: toon(0x111115), shin: toon(0x111115), shoe: toon(0x0d0d10), sole: toon(0xdedde6) };

    [[.105, .13, .02], [.3, -1, .1], .15, .03], [[-.105, .13, .02], [-.3, -1, .1], .15, .03], [[.09, .17, -.06], [.7, -.5, -.4], .12, .03], [[-.09, .17, -.06], [-.7, -.5, -.4], .12, .03],

    [[.04, .235, 0], [.5, .7, -.4], .1, .03], [[-.03, .24, .02], [-.4, .6, .3], .09, .028], [[.0, .24, .05], [.15, .5, .7], .09, .026]];

  const glowC = basic(C3(.35, 1.7, 2.3));

    renderer.clippingPlanes = clipPlane; renderer.setRenderTarget(rtRef); renderer.clear(); renderer.render(scene, mirrorCam);
    renderer.clippingPlanes = []; floor.visible = true; sky.position.copy(camera.position);
    renderer.setRenderTarget(rtScene); renderer.clear(); renderer.render(scene, camera);
    // bloom
    brightMat.uniforms.t.value = rtScene.texture; pass(brightMat, rtA);
    const bw = 1 / rtA.width, bh = 1 / rtA.height;
    for (const sp of [1, 2.4]) { blurMat.uniforms.t.value = rtA.texture; blurMat.uniforms.dir.value.set(bw * sp, 0); pass(blurMat, rtB); blurMat.uniforms.t.value = rtB.texture; blurMat.uniforms.dir.value.set(0, bh * sp); pass(blurMat, rtA); }
  }
  const cu = compMat.uniforms;
  cu.uBloom.value = S.bloom * 1.1; cu.uFlash.value = RM ? S.flash * .3 : S.flash; cu.uFlashC.value.copy(S.flashC); cu.uFade.value = S.fade; cu.uAb.value = RM ? .002 : S.ab; cu.uT.value = t; cu.uTint.value.copy(S.tint);
  cu.uAsp.value = camera.aspect;
  if (S.lens && !RM) { _p.copy(S.lens).project(camera); cu.uLens.value.set((_p.x + 1) / 2, (_p.y + 1) / 2); cu.uLensS.value = S.lensS; } else cu.uLensS.value = 0;
  pass(compMat, null);
  drawFX(S.fx, t);
  const tk = S.title;
  titleEl.style.opacity = tk > 0 ? (sstep(.1, .75, tk) * (1 - (tk > 0 ? 0 : 1))).toFixed(3) : 0;
  titleEl.style.letterSpacing = ''; titleEl.firstElementChild.style.filter = tk > 0 ? `blur(${(4 * (1 - sstep(.1, .8, tk))).toFixed(2)}px)` : '';
  return cut;
}

// ---------- sound ----------
let AC = null, master, NB, rainSrc = null, rainGain, soundOn = false;
function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.gain.value = .55; master.connect(comp); comp.connect(AC.destination);
  NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  rainSrc = AC.createBufferSource(); rainSrc.buffer = NB; rainSrc.loop = true; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = .6;
  rainGain = AC.createGain(); rainGain.gain.value = 0; rainSrc.connect(f); f.connect(rainGain); rainGain.connect(master); rainSrc.start();
}
function env(g, t0, dur, peak) { g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(.02, dur * .2)); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); }
function noise(t0, dur, type, f0, f1, peak, q = 1) { const s = AC.createBufferSource(); s.buffer = NB; const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur); const g = AC.createGain(); env(g, t0, dur, peak); s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + .05); }
function tone(t0, dur, type, f0, f1, peak) { const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur); const g = AC.createGain(); env(g, t0, dur, peak); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05); }
const SFX = {
  kick: t => { tone(t, .35, 'sine', 130, 40, .9); noise(t, .05, 'lowpass', 3000, 400, .3); },
  step: t => { noise(t, .18, 'bandpass', 1800, 600, .5, 2); tone(t, .12, 'sine', 90, 50, .4); },
  ring: t => { noise(t, .5, 'bandpass', 400, 5000, .7, 3); tone(t, .5, 'triangle', 1400, 2400, .08); },
  wire: t => { tone(t, .35, 'sawtooth', 2400, 5200, .05); noise(t, .2, 'highpass', 4000, 9000, .5); },
  hit: t => { tone(t, .6, 'sine', 120, 30, 1); noise(t, .4, 'lowpass', 5000, 150, .8); },
  grav: t => { tone(t, 1.1, 'sine', 55, 30, .9); tone(t, 1.1, 'sawtooth', 110, 55, .06); },
  sonar: t => { [880, 1320, 1760].forEach((f, i) => tone(t + i * .08, .6, 'sine', f, f * .98, .12)); },
  swell: t => { noise(t, 1.1, 'lowpass', 200, 3000, .6); tone(t, 1.1, 'sawtooth', 40, 80, .1); },
  final: t => { tone(t, 1.5, 'sine', 80, 25, 1); noise(t, 1.2, 'lowpass', 6000, 60, .9); tone(t, 2.4, 'sine', 55, 54, .25); }
};
const EV = [[1.62, 'step'], [3.0, 'kick'], [3.55, 'ring'], [4.3, 'kick'], [5.2, 'kick'], [5.72, 'wire'], [6.0, 'hit'], [6.3, 'kick'], [7.2, 'grav'], [8.4, 'kick'], [8.6, 'sonar'], [9.2, 'sonar'], [10.3, 'kick'], [11.3, 'swell'], [12.5, 'kick'], [13.0, 'kick'], [13.9, 'final']];
function sfxBetween(a, b) { if (!soundOn || !AC || b - a > .5) return; for (const [et, n] of EV) if (a < et && et <= b) SFX[n](AC.currentTime + .01); }

// ---------- UI ----------
const tcf = t => `${Math.floor(t)}+${String(Math.floor((t % 1) * 24)).padStart(2, '0')}`;
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc'), nowEl = document.getElementById('now'), replay = document.getElementById('replay'), sndBtn = document.getElementById('snd');
const cutsEl = document.getElementById('cuts'), cutBtns = {};
for (const c of CUTS) { const li = document.createElement('li'), b = document.createElement('button'); b.style.setProperty('--c', `var(--${c.col})`); b.innerHTML = `<span class="no">${c.id} · ${tcf(c.a)}</span>`; b.append(c.name); b.addEventListener('click', () => seek(c.a + .001)); li.append(b); cutsEl.append(li); cutBtns[c.id] = b; }
let T = RM ? 12.9 : 0, playing = !RM, dirty = true, activeCut = null, last = performance.now();
function setPlaying(p) { playing = p; playBtn.textContent = p ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', p ? '一時停止' : '再生'); replay.hidden = !(T >= DUR && !p); if (rainGain) rainGain.gain.value = p && soundOn ? .1 : 0; dirty = true; }
function seek(t) { T = clamp(t, 0, DUR); dirty = true; replay.hidden = true; }
playBtn.addEventListener('click', () => { if (!playing && T >= DUR) T = 0; setPlaying(!playing); });
document.getElementById('restart').addEventListener('click', () => { seek(0); setPlaying(true); });
replay.addEventListener('click', () => { seek(0); setPlaying(true); });
scrub.addEventListener('input', () => seek(+scrub.value));
sndBtn.addEventListener('click', () => {
  if (!AC) { try { initAudio(); } catch (e) { sndBtn.textContent = 'サウンド 利用不可'; return; } }
  if (AC.state === 'suspended') AC.resume();
  soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', soundOn); sndBtn.textContent = soundOn ? 'サウンド オン' : 'サウンド オフ'; setPlaying(playing);
});
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });

let RW = 1, RH = 1;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false);
  RW = Math.max(2, Math.round(w * PR)); RH = Math.max(2, Math.round(h * PR));
  rtScene.setSize(RW, RH); rtRef.setSize(RW >> 1, RH >> 1); rtA.setSize(RW >> 2, RH >> 2); rtB.setSize(RW >> 2, RH >> 2);
  fxc.width = RW; fxc.height = RH; camera.aspect = w / Math.max(1, h); dirty = true;
}
new ResizeObserver(resize).observe(stage); resize();
setPlaying(playing);

function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) { const prev = T; T = Math.min(DUR, T + dt); sfxBetween(prev, T); if (T >= DUR) setPlaying(false); dirty = true; }
  if (dirty) {
    const cut = render(Math.min(T, DUR - .001)); dirty = false;
    if (document.activeElement !== scrub) scrub.value = T.toFixed(2);
    tcEl.innerHTML = `<b>${tcf(T)}</b> / 15+00`;
    if (cut !== activeCut) { if (activeCut) cutBtns[activeCut.id].classList.remove('on'); cutBtns[cut.id].classList.add('on'); activeCut = cut; nowEl.innerHTML = `<b>${cut.id}</b>${cut.name}`; }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__noctisSeek = t => { seek(t); setPlaying(false); };
})();
</script>
